<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <rect width="1200" height="620" rx="28" fill="#f8fafc"/>
  <text x="52" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#0f172a">문제 상황: 공항 내부 작업 영상에서 놓치기 쉬운 안전 이슈</text>
  <text x="52" y="110" font-family="Arial, sans-serif" font-size="18" fill="#475569">단순 객체 탐지만으로는 침입 여부와 시설물 정상 상태를 판단하기 어렵습니다.</text>
  <g>
    <rect x="56" y="150" width="520" height="390" rx="20" fill="#ffffff" stroke="#dbeafe" stroke-width="3"/>
    <text x="88" y="195" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#1e3a8a">① 작업 구역 침입</text>
    <rect x="88" y="220" width="456" height="245" rx="14" fill="#dbeafe"/>
    <rect x="88" y="366" width="456" height="99" fill="#cbd5e1"/>
    <path d="M135 383 L500 383 L455 440 L180 440 Z" fill="#facc15" fill-opacity="0.25" stroke="#f59e0b" stroke-width="5" stroke-dasharray="12 8"/>
    <text x="248" y="425" font-family="Arial, sans-serif" font-size="21" font-weight="900" fill="#92400e">통제 영역</text>
    <circle cx="250" cy="335" r="15" fill="#ef4444"/><rect x="239" y="350" width="22" height="58" rx="9" fill="#ef4444"/>
    <rect x="220" y="315" width="82" height="112" fill="none" stroke="#dc2626" stroke-width="5"/>
    <text x="310" y="335" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#b91c1c">비작업자 접근</text>
    <text x="88" y="502" font-family="Arial, sans-serif" font-size="16" fill="#475569">카메라별 시야가 달라 감시 영역을 매번 수동 지정해야 했습니다.</text>
  </g>
  <g>
    <rect x="624" y="150" width="520" height="390" rx="20" fill="#ffffff" stroke="#dbeafe" stroke-width="3"/>
    <text x="656" y="195" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#1e3a8a">② 시설물 정상 여부 확인</text>
    <rect x="656" y="220" width="456" height="245" rx="14" fill="#f1f5f9"/>
    <g transform="translate(725 286)">
