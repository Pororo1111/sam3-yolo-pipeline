<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L0,12 L12,6 z" fill="#2563eb"/></marker></defs>
  <rect width="1200" height="560" rx="28" fill="#f8fafc"/>
  <text x="52" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#0f172a">전체 파이프라인 구조</text>
  <text x="52" y="108" font-family="Arial, sans-serif" font-size="18" fill="#475569">SAM3와 로컬 LLM(Gemma 4 12B)으로 데이터셋을 구축하고, YOLO와 ByteTrack으로 안전 이벤트를 판단합니다.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(58,180)"><rect width="125" height="110" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="3"/><text x="62" y="38" text-anchor="middle" font-size="17" font-weight="800" fill="#1e3a8a">공항 영상</text><text x="62" y="68" text-anchor="middle" font-size="13" fill="#475569">프레임 추출</text></g>
    <path d="M190 235 H235" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(250,180)"><rect width="125" height="110" rx="18" fill="#ffffff" stroke="#bbf7d0" stroke-width="3"/><text x="62" y="38" text-anchor="middle" font-size="19" font-weight="800" fill="#166534">SAM3</text><text x="62" y="68" text-anchor="middle" font-size="13" fill="#475569">객체 분할</text></g>
    <path d="M382 235 H427" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(442,180)"><rect width="155" height="110" rx="18" fill="#ffffff" stroke="#fed7aa" stroke-width="3"/><text x="77" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#9a3412">Gemma 4 12B</text><text x="77" y="66" text-anchor="middle" font-size="13" fill="#475569">라벨 기준 정리</text></g>
    <path d="M605 235 H650" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(665,180)"><rect width="125" height="110" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="3"/><text x="62" y="38" text-anchor="middle" font-size="19" font-weight="800" fill="#1d4ed8">YOLO</text><text x="62" y="68" text-anchor="middle" font-size="13" fill="#475569">학습/탐지</text></g>
    <path d="M798 235 H843" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(858,180)"><rect width="145" height="110" rx="18" fill="#ffffff" stroke="#fbcfe8" stroke-width="3"/><text x="72" y="38" text-anchor="middle" font-size="18" font-weight="800" fill="#be185d">ByteTrack</text><text x="72" y="68" text-anchor="middle" font-size="13" fill="#475569">객체 추적</text></g>
    <path d="M1010 235 H1055" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(1070,180)"><rect width="88" height="110" rx="18" fill="#ffffff" stroke="#fecaca" stroke-width="3"/><text x="44" y="38" text-anchor="middle" font-size="15" font-weight="800" fill="#991b1b">안전</text><text x="44" y="62" text-anchor="middle" font-size="15" font-weight="800" fill="#991b1b">이벤트</text></g>
  </g>
  <g font-family="Arial, sans-serif">
    <rect x="150" y="360" width="900" height="110" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="3"/>
    <text x="180" y="400" font-size="22" font-weight="900" fill="#1e3a8a">핵심 판단 흐름</text>
    <text x="180" y="435" font-size="16" fill="#334155">객체가 보였는가 → 같은 객체가 계속 추적되는가 → 추천 감시 영역 안에 들어왔는가 → 정상 기준을 벗어났는가</text>
    <text x="180" y="462" font-size="15" fill="#64748b">침입 감지, 에스컬레이터 안전바 결손, 작업 통제선 접근 이벤트 생성</text>
  </g>
</svg>