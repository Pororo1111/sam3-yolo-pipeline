  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L0,12 L12,6 z" fill="#2563eb"/></marker></defs>
  <rect width="1200" height="560" rx="28" fill="#f8fafc"/>
