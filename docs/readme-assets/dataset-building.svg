  <rect x="105" y="385" width="990" height="72" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="3"/>
  <text x="140" y="428" font-family="Arial, sans-serif" font-size="19" font-weight="800" fill="#1e3a8a">목표: 사람이 모든 프레임을 직접 라벨링하지 않고, 자동 생성 후보를 검수하는 방식으로 구축 비용을 줄입니다.</text>
