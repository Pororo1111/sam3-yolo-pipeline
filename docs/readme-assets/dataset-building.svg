  <text x="52" y="108" font-family="Arial, sans-serif" font-size="18" fill="#475569">SAM3 분할 결과와 Gemma 4 12B 라벨 보조를 활용하여 YOLO 학습 데이터를 구성합니다.</text>
  <g font-family="Arial, sans-serif">
