    <path d="M245 248 H305" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(320,185)"><rect width="165" height="125" rx="18" fill="#ffffff" stroke="#bbf7d0" stroke-width="3"/><text x="82" y="42" text-anchor="middle" font-size="20" font-weight="900" fill="#166534">SAM3 분할</text><text x="82" y="78" text-anchor="middle" font-size="14" fill="#475569">객체 후보 마스크</text></g>
    <path d="M495 248 H555" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(570,185)"><rect width="185" height="125" rx="18" fill="#ffffff" stroke="#fed7aa" stroke-width="3"/><text x="92" y="40" text-anchor="middle" font-size="19" font-weight="900" fill="#9a3412">Gemma 4 12B</text><text x="92" y="75" text-anchor="middle" font-size="14" fill="#475569">라벨 기준 정리</text></g>
    <path d="M765 248 H825" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(840,185)"><rect width="165" height="125" rx="18" fill="#ffffff" stroke="#fecaca" stroke-width="3"/><text x="82" y="42" text-anchor="middle" font-size="20" font-weight="900" fill="#991b1b">사용자 검수</text><text x="82" y="78" text-anchor="middle" font-size="14" fill="#475569">오탐/누락 수정</text></g>
    <path d="M1015 248 H1065" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
